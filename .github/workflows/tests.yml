name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Collect-only check
        run: python -m pytest tests/ --ignore=tests/integration --collect-only -q 2>&1 | tail -3

      - name: Run core tests (628+)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/integration --tb=long -v 2>&1 | tee /tmp/pytest_output.txt

      - name: Write test output to step summary
        if: always()
        run: |
          echo "## Pytest Output (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo '### FAILED / ERROR lines:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^FAILED|^ERRORS|^=.*FAILURES|^=.*ERRORS|short test summary|Process completed" /tmp/pytest_output.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no FAILED lines found)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### Last 100 lines of full output:' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 /tmp/pytest_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check exit code
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Tests failed. See step summary for details."
            exit 1
          fi
