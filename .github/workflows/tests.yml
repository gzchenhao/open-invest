name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Collect-only check
        run: python -m pytest tests/ --ignore=tests/integration --collect-only -q 2>&1 | tail -3

      - name: Run core tests (628+)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/integration --tb=long -v 2>&1 | tee /tmp/pytest_output.txt

      - name: Report failures
        if: always() && steps.tests.outcome != 'success'
        run: |
          # Extract key failure info and emit as error annotations
          echo "=== PYTEST OUTPUT START ==="
          head -30 /tmp/pytest_output.txt 2>/dev/null || echo "(no output file)"
          echo "=== PYTEST OUTPUT MIDDLE (FAILED lines) ==="
          grep -E "FAILED|ERROR|Error|error|Exception|Traceback|assert" /tmp/pytest_output.txt 2>/dev/null | head -20 || echo "(no failure lines)"
          echo "=== PYTEST OUTPUT END (last 50 lines) ==="
          tail -50 /tmp/pytest_output.txt 2>/dev/null || echo "(no output file)"
          echo "=== PYTEST OUTPUT DONE ==="

          # Also emit as annotation (first 4000 chars of last 50 lines)
          SUMMARY=$(tail -50 /tmp/pytest_output.txt 2>/dev/null | head -c 4000 | tr '\n' '|')
          echo "::error::PYTEST_OUTPUT_PY${{ matrix.python-version }}=${SUMMARY}"

      - name: Check exit code
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::Tests failed. Check 'Report failures' step output."
            exit 1
          fi
