name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Collect-only check
        run: python -m pytest tests/ --ignore=tests/integration --collect-only -q 2>&1 | tail -3

      - name: Run core tests (628+)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/integration --tb=long -v 2>&1 | tee /tmp/pytest_output.txt

      - name: Report failures as annotations
        if: always()
        run: |
          echo "=== FAILED/ERROR lines ==="
          grep -E "^FAILED|^ERRORS|^=.*FAILURES|^=.*ERRORS|short test summary" /tmp/pytest_output.txt || echo "(no FAILED lines found)"
          echo "=== Last 30 lines ==="
          tail -30 /tmp/pytest_output.txt
          echo "=== First 30 lines ==="
          head -30 /tmp/pytest_output.txt

      - name: Check exit code
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::Tests failed. Check 'Report failures' step for details."
            exit 1
          fi
