name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Collect-only check
        run: python -m pytest tests/ --ignore=tests/integration --collect-only -q 2>&1 | tail -3

      - name: Run core tests (628+)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/ --ignore=tests/integration --tb=long -v 2>&1 | tee /tmp/pytest_output.txt

      - name: Post test output as commit comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/pytest_output.txt', 'utf8');
            } catch (e) {
              output = 'Could not read pytest output: ' + e.message;
            }
            const lines = output.split('\n');
            const last80 = lines.slice(-80).join('\n');
            const first30 = lines.slice(0, 30).join('\n');
            const body = `## Pytest Output (Python ${{ matrix.python-version }})\n\n### First 30 lines:\n\`\`\`\n${first30}\n\`\`\`\n\n### Last 80 lines:\n\`\`\`\n${last80}\n\`\`\`\n`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

      - name: Check exit code
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "::error::Tests failed. See commit comment for details."
            exit 1
          fi
