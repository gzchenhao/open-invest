  <h1>首台（套）重大技术装备保险补偿机制（节选）</h1>
  <p>为支持首台（套）重大技术装备推广应用，建立市场化风险分担机制，对投保企业给予保险补偿。</p>
  <h2>补偿标准</h2>
  <p>对符合条件的投保企业，按实际投保年度保费的80%给予补贴，费率上限3%。以实际投保年度保费为计算基数，按实际投保年度保费的80%给予补贴，费率上限3%。</p>
  <h2>申请条件（节选）</h2>
  <p>（一）投保企业须为在中华人民共和国境内注册、具有独立法人资格的企业。</p>
  <p>（二）投保装备须列入《首台（套）重大技术装备推广应用指导目录》。</p>
  <p>（三）企业注册成立一年以上，且无重大违法记录。</p>
  <p>（四）科技人员占企业当年职工总数的比例不低于10%。</p>
