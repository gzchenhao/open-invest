<h1>深圳市人工智能产业发展规划</h1>
<p>发布机关：深圳市工业和信息化局</p>
<p>发布日期：2026年3月1日</p>
<p>本规划自2026年3月1日至2030年12月31日施行。</p>
<p>支持人工智能企业在本市高质量发展。重点培育机器人、半导体等产业。</p>
<p>最高支持500万元，用于研发投入。</p>
<p>申报条件：1. 在深圳市注册并依法纳税。2. 从事人工智能领域业务。</p>
<p>申报对象：在深圳市注册的人工智能企业。</p>
<p>联系电话：0755-12345678 邮箱：ai@sz.gov.cn</p>
